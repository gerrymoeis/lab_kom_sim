{{ template "layout/base.html" . }}

<div class="container mt-4">
    {{ template "layout/card_edit.html" . }}

                    <form method="POST" action="{{$.basePath}}/device-types/create">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Nama Tipe *</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="category_id" class="form-label">Kategori *</label>
                                <select class="form-select" id="category_id" name="category_id" required>
                                    <option value="">Pilih kategori...</option>
                                    {{ range $c := .categories }}
                                    <option value="{{ $c.ID }}">{{ $c.Name }}</option>
                                    {{ end }}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="brand" class="form-label">Brand</label>
                                <input type="text" class="form-control" id="brand" name="brand">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="model" class="form-label">Model</label>
                                <input type="text" class="form-control" id="model" name="model">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="label_prefix" class="form-label">Label Prefix</label>
                                <input type="text" class="form-control" id="label_prefix" name="label_prefix">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="usage_type" class="form-label">Tipe Penggunaan *</label>
                                <select class="form-select" id="usage_type" name="usage_type" required>
                                    <option value="loanable">Dipinjamkan</option>
                                    <option value="consumable">Habis Pakai</option>
                                    <option value="installable">Instalasi</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="default_location" class="form-label">Lokasi Default</label>
                                <input type="text" class="form-control" id="default_location" name="default_location">
                            </div>
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
                            <button type="submit" id="submitBtn" class="btn btn-primary">
                                <i class="bi bi-save"></i> Simpan
                            </button>
                            <a href="{{$.basePath}}/devices" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Batal
                            </a>
                        </div>
                    </form>
    {{ template "layout/card_close.html" . }}
</div>

{{ template "layout/footer.html" . }}
